<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1d4ed8">
<title>Registro de cliente – Cast Comercial</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Registration for new customers, opened from the QR code. Nothing is stored here: the data goes
   to the owners as a WhatsApp message. */
:root{--bg:#f3f4f7;--card:#fff;--text:#171a21;--muted:#667085;--line:#e2e5eb;--accent:#1d4ed8;--accent-soft:#e3ebff;--on-accent:#fff;--err:#c62828;--wa:#128c4a}
@media (prefers-color-scheme: dark){:root{--bg:#0f1218;--card:#191d26;--text:#eef0f4;--muted:#98a2b3;--line:#2a303c;--accent:#6b93ff;--accent-soft:#1d2a4d;--on-accent:#0b1020;--err:#f87171;--wa:#3ecf7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 4px;text-align:center}
.brand{text-align:center;margin:4px 0 6px}.brand img{width:88px;height:88px;border-radius:50%}
.lead{color:var(--muted);margin:0 0 18px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.field{margin-bottom:16px}
label.l{display:block;font-weight:650;margin-bottom:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
.pay{display:grid;gap:8px}
.veh{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.veh label{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px 6px;font-size:15px;font-weight:600;text-align:center;cursor:pointer;min-height:84px}
.veh input{position:absolute;opacity:0;pointer-events:none}
.veh .ic{font-size:28px;line-height:1}
.veh label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.veh label:has(input:focus-visible){outline:2px solid var(--accent)}
.pay label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:600;cursor:pointer}
.pay input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.pay label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--err);font-weight:600;margin:4px 0 0;font-size:15px}
button{width:100%;font:inherit;font-size:18px;font-weight:700;padding:15px;border:0;border-radius:14px;background:var(--wa);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.info{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:15px;line-height:1.4;text-align:left}
.info svg{flex:none;margin-top:-1px}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0;text-align:center}
.done{text-align:center}
.done .big{font-size:44px;line-height:1}
.done a{color:var(--accent);font-weight:650}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="logo.png" alt="Cast Comercial" width="88" height="88"></div>
  <h1 id="title">Registro de cliente</h1>
  <p class="lead" id="lead">Completá tus datos. Tarda menos de un minuto.</p>
  <form class="card" id="f" novalidate>
    <div class="field"><label class="l" for="n">Nombre</label><input id="n" type="text" autocomplete="name" autocapitalize="words" required></div>
    <div class="field"><label class="l" for="p">Teléfono (WhatsApp)</label><input id="p" type="tel" autocomplete="tel" inputmode="tel" placeholder="11 5555-0000" required></div>
    <div class="field"><span class="l" style="display:block;font-weight:650;margin-bottom:6px">¿Qué vehículo tenés?</span>
      <div class="veh" role="radiogroup">
        <label><input type="radio" name="v" value="auto"><span class="ic" aria-hidden="true">🚗</span>Auto</label>
        <label><input type="radio" name="v" value="moto"><span class="ic" aria-hidden="true">🏍️</span>Moto</label>
        <label><input type="radio" name="v" value="camion"><span class="ic" aria-hidden="true">🚚</span>Camioneta / camión</label>
        <label><input type="radio" name="v" value="bici"><span class="ic" aria-hidden="true">🚲</span>Bicicleta</label>
      </div></div>
    <div class="field" id="kf" hidden><label class="l" for="k">Patente</label><input id="k" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase" placeholder="AB 123 CD" required></div>
    <div class="field"><span class="l" style="display:block;font-weight:650;margin-bottom:6px">¿En qué estacionamiento?</span>
      <div class="pay" role="radiogroup" id="lots"></div></div>
    <div class="field"><span class="l" style="display:block;font-weight:650;margin-bottom:6px">¿Cómo vas a pagar?</span>
      <div class="pay" role="radiogroup">
        <label><input type="radio" name="f" value="mp">Mercado Pago</label>
        <label><input type="radio" name="f" value="cash">Efectivo</label>
        <label><input type="radio" name="f" value="transfer">Transferencia bancaria</label>
      </div></div>
    <div id="e" class="err" role="alert"></div>
    <button type="submit"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span>Enviar por WhatsApp</span></button>
    <div class="info" role="note"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/></svg><span>Se abre WhatsApp con tus datos; solo tenés que tocar «Enviar».</span></div>
  </form>
  <div class="card done" id="ok" hidden>
    <div class="big">✓</div>
    <h2>¡Gracias!</h2>
    <p>Si WhatsApp no se abrió, <a id="again" href="#" target="_blank" rel="noopener">tocá acá</a>.</p>
  </div>
</main>
<script>
(function(){
  'use strict';
  var q = new URLSearchParams(location.search);
  var DEFAULT_TO = '5491178170831';                 /* WhatsApp number that receives the sign-ups (digits, with 549 for Argentina) */
  var APP = 'https://app.castcomercial.com/';
  var to = (q.get('to') || DEFAULT_TO).replace(/\D/g, '');
  var biz = (q.get('n') || 'Cast Comercial').trim().slice(0, 60);
  if(biz){ document.getElementById('title').textContent = 'Registro – ' + biz; document.title = 'Registro – ' + biz; }
  var $ = function(id){ return document.getElementById(id); };
  /* the parking lots to choose from - change the names here */
  var LOTS = (q.get('e') || '').split('|').map(function(x){ return x.replace(/\s+/g, ' ').trim().slice(0, 60); }).filter(Boolean).slice(0, 12);
  if(!LOTS.length) LOTS = ['Lope de Vega', 'Bolivia', 'Condarco'];        /* the three parking lots of Cast Comercial */
  $('lots').innerHTML = LOTS.map(function(n, i){ return '<label><input type="radio" name="lot" value="' + i + '">' + n.replace(/[<&>"]/g, '') + '</label>'; }).join('');
  if(LOTS.length === 1) document.querySelector('input[name=lot]').checked = true;
  var PAY = { mp:'Mercado Pago', cash:'Efectivo', transfer:'Transferencia bancaria' };
  function plate(v){
    var s = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var m;
    if((m = /^([A-Z]{2})(\d{3})([A-Z]{2})$/.exec(s))) return m[1] + ' ' + m[2] + ' ' + m[3];
    if((m = /^([A-Z]{3})(\d{3})$/.exec(s))) return m[1] + ' ' + m[2];
    if((m = /^([A-Z])(\d{3})([A-Z]{3})$/.exec(s))) return m[1] + m[2] + ' ' + m[3];       /* motorcycles: A123 BCD */
    if((m = /^(\d{3})([A-Z]{3})$/.exec(s))) return m[1] + ' ' + m[2];                   /* older motorcycles: 123 ABC */
    return s;
  }
  if(!to){ $('e').textContent = 'Este código no está completo (falta el número de WhatsApp). Pedí el código nuevo en el estacionamiento.'; }
  $('k').addEventListener('blur', function(){ this.value = plate(this.value); });
  var VEH = { auto:'Auto', moto:'Moto', camion:'Camioneta / camión', bici:'Bicicleta' };
  var PH = { auto:'AB 123 CD', moto:'A123 BCD', camion:'AB 123 CD' };
  Array.prototype.forEach.call(document.querySelectorAll('input[name=v]'), function(r){ r.addEventListener('change', function(){
    var bici = r.value === 'bici';                      /* a bicycle has no plate */
    $('kf').hidden = bici; $('k').placeholder = PH[r.value] || '';
    if(!bici && !$('k').value) setTimeout(function(){ $('k').focus(); }, 50);
  }); });
  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var n = $('n').value.replace(/\s+/g, ' ').trim(), p = $('p').value.trim(), k = plate($('k').value), sel = document.querySelector('input[name=f]:checked');
    var fail = function(msg, id){ $('e').textContent = msg; if(id) $(id).focus(); };
    if(!to) return fail('Este código no está completo (falta el número de WhatsApp).');
    if(n.length < 2) return fail('Escribí tu nombre.', 'n');
    if(p.replace(/\D/g, '').length < 6) return fail('Escribí tu número de teléfono.', 'p');
    var veh = document.querySelector('input[name=v]:checked');
    if(!veh) return fail('Elegí qué vehículo tenés.');
    if(veh.value !== 'bici' && k.replace(/\s/g, '').length < 5) return fail('Escribí la patente.', 'k');
    var lot = document.querySelector('input[name=lot]:checked');
    if(!lot) return fail('Elegí el estacionamiento.');
    if(!sel) return fail('Elegí cómo vas a pagar.');
    $('e').textContent = '';
    var text = 'Hola, quiero registrarme en el estacionamiento.\n\nNombre: ' + n + '\nTeléfono: ' + p + '\nVehículo: ' + VEH[veh.value] + (veh.value === 'bici' ? '' : '\nPatente: ' + k) + '\nEstacionamiento: ' + LOTS[+lot.value] + '\nPago: ' + PAY[sel.value];
    var url = 'https://wa.me/' + to + '?text=' + encodeURIComponent(text);
    $('again').href = url;
    $('f').hidden = true; $('lead').hidden = true; $('ok').hidden = false;
    location.href = url;
  });
})();
</script>
</body>
</html>
